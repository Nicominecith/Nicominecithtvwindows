name: Build Windows (EXE)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Build (Installer, Downloader, Portable)
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NicominecithTV-Windows
          path: |
            dist/*.exe
            dist/*.7z
            dist/latest.yml
      - name: Release hochladen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.7z
            dist/latest.yml
